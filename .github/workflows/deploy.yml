name: CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Production App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Nuxt 3 Production App
        run: npm run build
        env:
          NODE_ENV: production
          NUXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatwar-production-build
          path: .output/
          retention-days: 7
